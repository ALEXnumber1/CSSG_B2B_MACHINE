name: B2B Lead Scraper Cron

on:
  # Desactivado el 2026-10-12: no hace scraping, solo borra y reinserta un lead de prueba con datos
  # de una persona real en el CRM de producción, y desde la RLS fase B la clave anon ya no puede
  # escribir en `leads`. Queda disponible a mano.
  # schedule:
  #   - cron: '0 8 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scratch/test_scraper.js
