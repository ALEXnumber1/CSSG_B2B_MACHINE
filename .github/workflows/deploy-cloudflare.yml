name: Deploy to Cloudflare

# Builds the site (with prerendering) and deploys it to the cssg-global Worker.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one instead of racing it.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The prerender step drives headless Chrome; make sure Puppeteer's browser is present even if
      # npm skipped its postinstall download.
      - name: Install Chrome for prerendering
        run: npx puppeteer browsers install chrome

      - name: Build (Vite + SEO + prerender)
        run: npm run build
        # Public values (same as "vars" in wrangler.jsonc); Vite inlines them into the bundle.
        env:
          VITE_SUPABASE_URL: https://vqisebdthsowhpfpugrb.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxaXNlYmR0aHNvd2hwZnB1Z3JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNjE2MTAsImV4cCI6MjA5MjczNzYxMH0.9TZZ_6mx7vcaYoaeT5PmH02OrOzad6KMHiBwospgxOw

      # postbuild.js ships un-prerendered pages if Chrome fails (so a Vercel build never breaks).
      # Here that would silently undo the SEO work, so refuse to deploy instead.
      - name: Check every page was prerendered
        run: |
          total=$(grep -rl --include=index.html '<div id="root"' dist | wc -l)
          prerendered=$(grep -rl --include=index.html 'data-prerendered=' dist | wc -l)
          echo "Prerendered $prerendered of $total pages"
          if [ "$prerendered" -lt 60 ]; then
            echo "::error::Only $prerendered pages prerendered — aborting deploy"
            exit 1
          fi

      # Compare each page with the live one *before* deploying, so IndexNow only gets real changes.
      - name: Detect changed pages for IndexNow
        run: node scripts/indexnow.mjs diff
        continue-on-error: true

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A broken deploy (e.g. a bad _redirects rule) can take the whole site down. Check key pages
      # through the real domain and roll back to the previous version if any of them fails.
      - name: Smoke test production and roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 15
          failed=0
          for path in "/" "/consultoria" "/consultoria?utm_source=ci" "/analisis-riesgo" "/blog" "/streaming"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://cssg-global.com${path}")
            echo "$code ${path}"
            [ "$code" = "200" ] || failed=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://cssg-global.com/pagina-que-no-existe-ci")
          echo "$code /pagina-que-no-existe-ci (expect 404)"
          [ "$code" = "404" ] || failed=1
          if [ "$failed" = "1" ]; then
            echo "::error::Production smoke test failed — rolling back to the previous version"
            npx wrangler rollback -y --message "Auto-rollback: smoke test failed for ${GITHUB_SHA}"
            exit 1
          fi

      # Tell Bing (and ChatGPT search, which uses Bing's index) which pages changed. Runs only after
      # the smoke test passed; a failure here never fails the deploy.
      - name: Notify search engines via IndexNow
        run: node scripts/indexnow.mjs submit
        continue-on-error: true
